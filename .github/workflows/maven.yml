name: Java CI with Maven

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout PR code
      - uses: actions/checkout@v4

      # Checkout main baseline
      - name: Checkout baseline
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Run baseline tests
      - name: Build baseline
        if: github.event_name == 'pull_request'
        run: mvn -B -f baseline/pom.xml clean verify

      # Run PR tests
      - name: Build PR
        run: mvn -B clean verify

      # Upload PR JaCoCo report
      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      # Download JaCoCo CLI
      - name: Download JaCoCo CLI
        if: github.event_name == 'pull_request'
        run: |
          mvn -B dependency:get \
            -Dartifact=org.jacoco:org.jacoco.cli:0.8.13:jar:nodeps

      # Generate individual coverage reports
      - name: Compare JaCoCo coverage
        if: github.event_name == 'pull_request'
        run: |
          python scripts/compare_jacoco.py \
            --baseline baseline \
            --pr . \
            --jacoco-cli "$HOME/.m2/repository/org/jacoco/org.jacoco.cli/0.8.13/org.jacoco.cli-0.8.13-nodeps.jar" \
            --output coverage-comment.md

      # Publish PR comment
      - name: Add coverage comparison to PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: jacoco-coverage
          path: coverage-comment.md

      # Update dependency graph on main
      - name: Update dependency graph
        if: github.event_name == 'push'
        uses: advanced-security/maven-dependency-submission-action@v4
